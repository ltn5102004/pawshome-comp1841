<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PawsHome basic wireframes</title>
<style>
  body { margin: 0; background: #fff; font-family: Arial, Helvetica, sans-serif; color: #000; }
  #wrap { display: inline-block; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(3, 300px); gap: 22px; align-items: start; }
  .frame h2 { font-size: 15px; margin: 0 0 6px; }
  .page { border: 2.5px solid #000; padding: 8px; display: grid; gap: 8px; height: 330px; align-content: start; }
  .phone .page { width: 150px; height: 300px; border-radius: 14px; }
  .bar { border: 2px solid #000; height: 22px; display: flex; align-items: center; padding: 0 6px; font-size: 11px; font-weight: 700; }
  .bar span { margin-left: auto; letter-spacing: 3px; }
  /* image placeholder: a box with an X */
  .x { border: 2px solid #000; background:
        linear-gradient(to top right, transparent calc(50% - 1px), #000 calc(50% - 1px), #000 calc(50% + 1px), transparent calc(50% + 1px)),
        linear-gradient(to bottom right, transparent calc(50% - 1px), #000 calc(50% - 1px), #000 calc(50% + 1px), transparent calc(50% + 1px)); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .line { height: 7px; background: #000; opacity: .25; }
  .w60 { width: 60%; } .w40 { width: 40%; } .w80 { width: 80%; }
  .field { border: 2px solid #000; height: 18px; }
  .btn { border: 2px solid #000; height: 18px; width: 80px; border-radius: 10px; }
  .btn.fill { background: #000; }
  .side { border: 2px solid #000; width: 60px; }
</style>
</head>
<body>
<div id="wrap">
<div class="grid">

  <div class="frame"><h2>1. Home</h2><div class="page">
    <div class="bar">Logo<span>☰ menu</span></div>
    <div class="row"><div><div class="line"></div><div class="line w60" style="margin-top:6px"></div><div class="btn fill" style="margin-top:10px"></div></div><div class="x" style="height:80px"></div></div>
    <div class="row"><div class="x" style="height:60px"></div><div class="x" style="height:60px"></div><div class="x" style="height:60px"></div></div>
    <div class="bar">Footer</div>
  </div></div>

  <div class="frame"><h2>2. Find a pet (list + filters)</h2><div class="page">
    <div class="bar">Logo<span>☰ menu</span></div>
    <div class="row"><div class="field"></div><div class="field"></div><div class="field"></div></div>
    <div class="row"><div class="x" style="height:70px"></div><div class="x" style="height:70px"></div><div class="x" style="height:70px"></div></div>
    <div class="row"><div class="x" style="height:70px"></div><div class="x" style="height:70px"></div><div class="x" style="height:70px"></div></div>
    <div class="line w40" style="margin:0 auto"></div>
  </div></div>

  <div class="frame"><h2>3. Pet details</h2><div class="page">
    <div class="bar">Logo<span>☰ menu</span></div>
    <div class="row"><div class="x" style="height:110px"></div><div><div class="line"></div><div class="line w80" style="margin-top:8px"></div><div class="line w60" style="margin-top:8px"></div><div class="line w80" style="margin-top:8px"></div></div></div>
    <div class="line"></div><div class="line w80"></div>
    <div class="field" style="height:40px"></div>
    <div class="btn fill"></div>
  </div></div>

  <div class="frame"><h2>4. Add / edit pet (form)</h2><div class="page">
    <div class="bar">Logo<span>☰ menu</span></div>
    <div class="line w40"></div><div class="field"></div>
    <div class="row"><div class="field"></div><div class="field"></div></div>
    <div class="line w40"></div><div class="field" style="height:40px"></div>
    <div class="row"><div class="x" style="height:45px;flex:0 0 60px"></div><div class="field"></div></div>
    <div class="row"><div class="btn fill" style="flex:0 0 80px"></div><div class="btn" style="flex:0 0 80px"></div></div>
  </div></div>

  <div class="frame"><h2>5. Admin dashboard</h2><div class="page">
    <div class="row" style="height:310px"><div class="side" style="flex:0 0 60px"></div>
      <div style="display:grid;gap:8px;align-content:start">
        <div class="row"><div class="field" style="height:36px"></div><div class="field" style="height:36px"></div><div class="field" style="height:36px"></div></div>
        <div class="field" style="height:70px"></div>
        <div class="row"><div class="field" style="height:110px"></div><div class="field" style="height:110px"></div></div>
      </div></div>
  </div></div>

  <div class="frame phone"><h2>6. Phone</h2><div class="page">
    <div class="bar">Logo<span>☰</span></div>
    <div class="field"></div>
    <div class="x" style="height:70px"></div>
    <div class="x" style="height:70px"></div>
    <div class="x" style="height:70px"></div>
  </div></div>

</div>
</div>
</body>
</html>
